name: CI build

# Only people with write access can start a manual run, and no fork can trigger this workflow,
# so the signing secrets never reach code they didn't push.
on:
  workflow_dispatch:
    inputs:
      windows_x64:
        description: Windows x64
        type: boolean
        default: true
      macos_arm64:
        description: macOS arm64
        type: boolean
        default: true
      macos_x64:
        description: macOS x64
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # Draft releases are visible only to people with write access to the repository.
  draft:
    if: inputs.windows_x64 || inputs.macos_arm64 || inputs.macos_x64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.draft.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            CMakeLists.txt
            .github/scripts
          sparse-checkout-cone-mode: false

      - id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/scripts/create_draft_release.py

  windows-x64:
    needs: draft
    if: inputs.windows_x64
    permissions:
      contents: write
    uses: ./.github/workflows/build_windows.yml
    with:
      release-tag: ${{ needs.draft.outputs.tag }}

  macos-arm64:
    needs: draft
    if: inputs.macos_arm64
    permissions:
      contents: write
    uses: ./.github/workflows/build_macos.yml
    with:
      arch: arm64
      release-tag: ${{ needs.draft.outputs.tag }}
    secrets: inherit

  macos-x64:
    needs: draft
    if: inputs.macos_x64
    permissions:
      contents: write
    uses: ./.github/workflows/build_macos.yml
    with:
      arch: x86_64
      release-tag: ${{ needs.draft.outputs.tag }}
    secrets: inherit
