name: Build Windows

# Builds the x64 installer with clang-cl, signs it and the binaries it installs through SignPath, and
# uploads it with its PDBs to the draft release.
on:
  workflow_call:
    inputs:
      release-tag:
        type: string
        required: true
      signing-policy:
        description: SignPath signing policy slug
        type: string
        required: true
    secrets:
      SIGNPATH_API_TOKEN:
        required: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      VULKAN_SDK_VERSION: 1.4.363.0
      VULKAN_SDK_SHA256: 94A82D378F7A5E3E54C9DB7D2FB7016AF136E14AC0A18DBF0F2F67A36352D141
      CCACHE_VERSION: 4.14.1
      CCACHE_SHA256: 6219f3865ca59aec41ee4b678df171d5d35855ecb2b6dbbbd20690b3a68af7b4
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Restore Vulkan SDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\VulkanSDK\${{ env.VULKAN_SDK_VERSION }}
          key: vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}

      - name: Set up toolchain
        run: python .github/scripts/windows_tools.py

      - name: Restore soundfont
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: NeuralNote/Assets/SoundFont
          key: soundfont-${{ hashFiles('Tools/fetch_soundfont.py', 'Tools/make_soundfont.py') }}

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-windows-x64-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-windows-x64-

      - name: Build
        run: python .github/scripts/configure_and_build.py

      - name: Save ccache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-windows-x64-${{ github.run_id }}-${{ github.run_attempt }}

      # SignPath checks each file's product name and version against the artifact configuration.
      - name: Read version
        id: version
        run: '"version=$((Get-Item build/NeuralNote_artefacts/Release/Standalone/NeuralNote.exe).VersionInfo.ProductVersion)" >> $env:GITHUB_OUTPUT'

      - name: Stage binaries for signing
        run: python .github/scripts/package_windows.py prepare

      - name: Upload binaries for signing
        id: upload-binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-binaries
          path: ${{ runner.temp }}/signing/unsigned
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: Sign binaries
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ inputs.signing-policy }}
          artifact-configuration-slug: windows_binaries
          github-artifact-id: ${{ steps.upload-binaries.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.version }}"
          output-artifact-directory: ${{ runner.temp }}/signing/signed

      - name: Build installer
        run: python .github/scripts/package_windows.py installer

      - name: Upload installer for signing
        id: upload-installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: Installers/Windows/Output/NeuralNote_Installer_Windows_x64.exe
          archive: false
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: Sign installer
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ inputs.signing-policy }}
          artifact-configuration-slug: windows_installer
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.version }}"
          skip-decompress: true
          output-artifact-directory: ${{ runner.temp }}/signing/installer

      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          SIGNED_INSTALLER: ${{ runner.temp }}/signing/installer/NeuralNote_Installer_Windows_x64.exe
        run: gh release upload "$env:RELEASE_TAG" "$env:SIGNED_INSTALLER" Installers/Windows/Output/NeuralNote_Installer_Windows_x64_PDBs.zip --clobber
